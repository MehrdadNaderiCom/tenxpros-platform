# Clean TenXPros app stack.

services:
  db:
    image: postgres:16-alpine
    container_name: tenxpros-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tenxpros
      POSTGRES_PASSWORD: tenxpros_dev
      POSTGRES_DB: tenxpros
    ports:
      - "5433:5432"
    volumes:
      - tenxpros-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenxpros -d tenxpros"]
      interval: 5s
      timeout: 5s
      retries: 10

  tenxpros-app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: tenxpros-app
    restart: unless-stopped
    ports:
      - "3003:3000"
    env_file:
      - ./.env.production
    depends_on:
      db:
        condition: service_healthy

volumes:
  tenxpros-db-data:
