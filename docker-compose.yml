# Clean TenXPros app stack.

services:
  db:
    image: postgres:16-alpine
    container_name: tenxpros-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: tenxpros
      # Secret sourced from gitignored /opt/tenxpros/.env (never committed).
      # Only used on first cluster init; the live role password is managed via ALTER USER.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in /opt/tenxpros/.env}
      POSTGRES_DB: tenxpros
    # No host port publish: the app reaches Postgres over the internal compose
    # network at db:5432. Publishing to the host exposed it on 0.0.0.0 (Docker
    # DNAT bypasses ufw). Add "127.0.0.1:5433:5432" only if host-side psql is needed.
    volumes:
      - tenxpros-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenxpros -d tenxpros"]
      interval: 5s
      timeout: 5s
      retries: 10

  tenxpros-app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: tenxpros-app
    restart: unless-stopped
    ports:
      - "3003:3000"
    env_file:
      - ./.env.production
    depends_on:
      db:
        condition: service_healthy

volumes:
  tenxpros-db-data:
